<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela Básica</title>
    <style>
        body {
            margin: 0;
            background: #d9d9d9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            padding: 0;
        }

        table {
            border-collapse: collapse;
            width: 700px;
            border: 2px solid #000;
            margin: 20px 0 0 20px;
            background: transparent;
        }

        th, td {
            border: 1px solid #000;
            padding: 12px 10px;
            text-align: center;
            font-size: 16px;
            background: transparent;
        }

        th {
            background: #f0f0f0;
            font-weight: bold;
        }

        caption {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <table>
            <caption>Trajetória Acadêmica e Profissional</caption>
            <tr>
                <th rowspan="2">Estudante</th>
                <th colspan="2">Formação</th>
                <th rowspan="2">Ano de Conclusão</th>
            </tr>
            <tr>
                <th>Graduação</th>
                <th>Pós-graduação</th>
            </tr>
            <tr>
                <th>José</th>
                <td>Ciência da Computação</td>
                <td>Inteligência Artificial</td>
                <td>2023</td>
            </tr>
            <tr>
                <th>Ana</th>
                <td>Engenharia de Software</td>
                <td>Gestão de Projetos</td>
                <td>2022</td>
            </tr>
        </table>
    </div>
</body>
</html>
